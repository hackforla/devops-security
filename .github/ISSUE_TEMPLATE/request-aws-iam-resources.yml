name: 'Request AWS IAM user or service account'
description: 'Issue for requesting IAM accounts'
labels: ['feature: AWS user request','size: 1pt','role: DevOps Engineer', 'complexity: small']
projects: ['hackforla/73'] # CoP: DevOps: Project Board

body: 
    - type: input
      id: account-name
      attributes:
        label: Account Name
        description: Provide github handle of new user or service account name (if requesting for a service)
      validations: 
        required: true
    - type: input
      id: slack-member-id
      attributes:
        label: Slack Member ID
        description: "Your Slack member ID, not your @handle: in Slack, open your profile, click the ⋮ menu, and choose Copy member ID. It looks like U0123456789. We use it to send you your AWS console sign-in details on Slack. Leave blank when requesting a service account."
        placeholder: U0123456789
      validations:
        required: false
    - type: input
      id: project-name
      attributes:
        label: Project(s) Name
        description: Specify the project you are working on
      validations: 
        required: true
    - type: textarea
      id: access-reason
      attributes:
        label: Reason for access
        description: Mention the reason for requesting the access
      validations:
        required: true
    - type: textarea
      id: additional-info
      attributes: 
        label: Additional Information
        description: Any other information you want to provide
      validations:
        required: false    
